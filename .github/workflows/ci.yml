name: C++ CI with CMake/CTest and Coverage

on: 
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc g++ gcovr

    - name: Cache build directory
      uses: actions/cache@v3
      with:
        path: build
        key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt') }}
        # 排除 .gcda 和 .gcno 文件，避免覆盖率数据被缓存导致结果不准确
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Configure CMake (with coverage)
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_FLAGS="-fprofile-arcs -ftest-coverage --coverage"
        -DCMAKE_CXX_FLAGS="-fprofile-arcs -ftest-coverage --coverage"
        -DBUILD_TESTING=ON

    - name: Build project and tests
      run: cmake --build build --parallel 4

    - name: Run CTest
      run: |
        cd build
        ctest --output-on-failure --timeout 300

    - name: Generate and upload coverage report
      if: success()
      run: |
        cd build
        # 从 build 目录运行，使用正则表达式精确排除第三方库和构建目录本身
        gcovr . \
          --root=".." \
          --filter="../../src/" \
          --sonarqube sonarqube-coverage.xml \
          --print-summary \
          --html-details coverage.html
        echo "覆盖率报告已生成 (SonarQube XML 和 HTML)"
        # 查看摘要
        gcovr . --root=".." --exclude=".*/third_party/.*" --exclude=".*/build/.*" --print-summary

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: coverage-reports
        path: |
          build/sonarqube-coverage.xml
          build/coverage.html
